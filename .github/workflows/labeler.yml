name: Pull request labels

on: # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to label
        required: true
        type: number

permissions: {}

jobs:
  label:
    if: github.repository == 'Globgor/sgn' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels to an updated pull request
        if: github.event_name == 'pull_request'
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
      - name: Apply labels to a selected pull request
        if: github.event_name == 'workflow_dispatch'
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6
        with:
          pr-number: ${{ inputs.pr_number }}
