documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - 'ISSUE_TEMPLATE.md'
          - 'PULL_REQUEST_TEMPLATE.md'
github_actions:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
testing:
  - changed-files:
      - any-glob-to-any-file: ['t/**']
